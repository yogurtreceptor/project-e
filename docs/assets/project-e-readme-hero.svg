<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Project E</title>
  <desc id="desc">A dark, technical Project E banner showing connected canonical records flowing into local views and workflows.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263137" stroke-width="1"/>
    </pattern>
    <clipPath id="canvas">
      <rect width="1600" height="560" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
